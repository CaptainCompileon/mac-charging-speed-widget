name: Build macOS App & DMG

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MacChargingSpeed (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release App & WidgetKit Extension
        run: |
          xcodebuild -project MacChargingSpeed.xcodeproj \
            -scheme MacChargingSpeed \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify App & WidgetKit Packaging, Plists, and Entitlements
        run: |
          APP_PATH="build/Build/Products/Release/MacChargingSpeed.app"
          EXT_PATH="$APP_PATH/Contents/PlugIns/MacChargingSpeedWidget.appex"

          echo "=== App Info.plist ==="
          plutil -p "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP_PATH/Contents/Info.plist" | grep -q "true"

          echo "=== Widget Info.plist ==="
          plutil -p "$EXT_PATH/Contents/Info.plist"
          EXT_POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT_PATH/Contents/Info.plist")
          echo "NSExtensionPointIdentifier = $EXT_POINT"
          test "$EXT_POINT" = "com.apple.widgetkit-extension"

          echo "=== Code Signing & Entitlements ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1 | grep -q "com.apple.security.app-sandbox"
          codesign -d --entitlements :- "$EXT_PATH" 2>&1 | grep -q "com.apple.security.app-sandbox"
          echo "✅ Verified WidgetKit extension point and sandbox entitlements."

      - name: Package DMG & ZIP
        run: |
          APP_PATH="build/Build/Products/Release/MacChargingSpeed.app"
          mkdir -p dist dmg-stage
          cp -R "$APP_PATH" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "MacChargingSpeed" -srcfolder dmg-stage -ov -format UDZO dist/MacChargingSpeed.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/MacChargingSpeed.app.zip

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacChargingSpeed-macOS
          path: |
            dist/MacChargingSpeed.dmg
            dist/MacChargingSpeed.app.zip

      - name: Attach to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacChargingSpeed.dmg
            dist/MacChargingSpeed.app.zip
